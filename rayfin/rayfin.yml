id: demand-inventory-app
name: Demand_Inventory_App
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    password:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://localhost:5178
      - http://127.0.0.1:5178
      - http://localhost:5177
      - http://127.0.0.1:5177
      - https://stout-beach-abc2014255-centralindia.webapp.fabricapps.net
  data:
    enabled: true
    dialect: mssql
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
  storage:
    enabled: false
  functions:
    enabled: false
